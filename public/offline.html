<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9FF">
  <title>Không có kết nối | LifeRivo</title>
  <style>
    :root { --bg:#FAF9FF; --fg:#303047; --muted:#55536E; --accent:#6753E0; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#191826; --fg:#F2F0FB; --muted:#C7C4DC; --accent:#A99BFC; }
    }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; background:var(--bg); color:var(--fg); font:16px/1.55 "Nunito","Be Vietnam Pro",system-ui,"Segoe UI",sans-serif; text-align:center; }
    main { max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; font-weight: 800; padding: 12px 22px; min-height: 46px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 6px 16px rgba(103,83,224,.28); }
  </style>
</head>
<body>
  <main>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>Không kết nối được tới máy chủ. Kiểm tra mạng rồi thử lại. Bài đã mở trước đó có thể vẫn xem được khi mạng ổn định.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
