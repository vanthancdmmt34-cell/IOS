name: Android build (APK)

# Chạy thủ công: vào tab Actions > "Android build (APK)" > Run workflow.
# Địa chỉ máy chủ lấy từ ô nhập khi chạy, hoặc từ biến của repo: Settings > Secrets and variables > Actions > Variables > CAP_SERVER_URL.
# APK này ký bằng khóa debug, cài trực tiếp được trên Android (cần bật "Cài ứng dụng không rõ nguồn gốc").

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Địa chỉ HTTPS của máy chủ LifeRivo (ví dụ https://study.liferivo.com)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || vars.CAP_SERVER_URL }}
      CAP_APP_ID: ${{ vars.CAP_APP_ID || 'vn.liferivo.study' }}

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Cài Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Kiểm tra địa chỉ máy chủ
        run: |
          if [[ -z "$CAP_SERVER_URL" ]]; then
            echo "::error::Chưa có CAP_SERVER_URL. Nhập khi chạy workflow hoặc đặt biến CAP_SERVER_URL của repo."
            exit 1
          fi
          if [[ "$CAP_SERVER_URL" != https://* ]]; then
            echo "::error::CAP_SERVER_URL phải bắt đầu bằng https://."
            exit 1
          fi
          echo "Máy chủ: $CAP_SERVER_URL"

      - name: Cài thư viện Node
        run: npm ci

      - name: Tạo thư mục www (giao diện đóng gói sẵn)
        run: node tools/build-native.mjs

      - name: Đồng bộ Capacitor sang Android
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Đóng gói file APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "::error::Không tìm thấy file APK sau khi build"
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/LiferIvo-debug.apk

      - name: Tải file APK
        uses: actions/upload-artifact@v4
        with:
          name: LiferIvo-android-apk
          path: out/LiferIvo-debug.apk
          retention-days: 14
