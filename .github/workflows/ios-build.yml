name: iOS build (unsigned IPA)

# Chạy thủ công: vào tab Actions > "iOS build (unsigned IPA)" > Run workflow.
# Địa chỉ máy chủ lấy từ ô nhập khi chạy, hoặc từ biến của repo: Settings > Secrets and variables > Actions > Variables > CAP_SERVER_URL.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Địa chỉ HTTPS của máy chủ LifeRivo (ví dụ https://study.example.com)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build .ipa
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || vars.CAP_SERVER_URL }}
      CAP_APP_ID: ${{ vars.CAP_APP_ID || 'vn.liferivo.study' }}

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Cài Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Chọn Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Kiểm tra địa chỉ máy chủ
        run: |
          if [[ -z "$CAP_SERVER_URL" ]]; then
            echo "::error::Chưa có CAP_SERVER_URL. Nhập khi chạy workflow hoặc đặt biến CAP_SERVER_URL của repo."
            exit 1
          fi
          if [[ "$CAP_SERVER_URL" != https://* ]]; then
            echo "::error::CAP_SERVER_URL phải bắt đầu bằng https:// (iOS không cho tải nội dung http khi phát hành)."
            exit 1
          fi
          echo "Máy chủ: $CAP_SERVER_URL"

      - name: Cài thư viện Node
        run: npm ci

      - name: Tạo thư mục www (giao diện đóng gói sẵn)
        run: node tools/build-native.mjs

      - name: Đồng bộ Capacitor sang iOS (cài CocoaPods)
        run: npx cap sync ios

      - name: Liệt kê scheme Xcode
        working-directory: ios/App
        run: xcodebuild -list -workspace App.xcworkspace

      - name: Build archive (không ký)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Hiện lỗi build trong Annotations
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if [[ ! -f "$LOG" ]]; then
            echo "::error::Không có log xcodebuild: lỗi xảy ra trước bước build (xem log bước đỏ)."
            exit 0
          fi
          grep -E "error:|ARCHIVE FAILED|BUILD FAILED" "$LOG" | head -n 30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "--- 80 dòng cuối của log xcodebuild ---"
          tail -n 80 "$LOG"

      - name: Lưu log xcodebuild
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Đóng gói file .ipa
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::Không tìm thấy file .app trong archive"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr LiferIvo-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp LiferIvo-unsigned.ipa "$GITHUB_WORKSPACE/out/"

      - name: Tải file .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiferIvo-unsigned-ipa
          path: out/LiferIvo-unsigned.ipa
          retention-days: 14
